# Ansible Configuration File
# This file configures Ansible behavior for the TaskFlow deployment

[defaults]
# Disable host key checking for automated deployments
host_key_checking = False

# Inventory file location
inventory = ./hosts.ini

# Use the current user for remote connections
remote_user = ubuntu

# Number of parallel processes
forks = 5

# Timeout for gathering facts
gather_timeout = 30

# Logging
log_path = ./ansible.log

# Display skipped tasks
display_skipped_hosts = False

# Retry files
retry_files_enabled = False

# Callback plugins
stdout_callback = yaml
bin_ansible_callbacks = True

# Role path (if using custom roles)
roles_path = ./roles

[inventory]
# Enable plugins
enable_plugins = ini, yaml

[privilege_escalation]
# Use sudo for privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Timeout settings
timeout = 30
